<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <h2 class="mb-5 text-center fw-bold">Generador de Códigos QR</h2>

    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="mb-4">
          <label class="form-label text-secondary">Texto o URL a codificar</label>
          <input class="form-control" [(ngModel)]="texto" placeholder="https://..." />
        </div>

        <div class="row g-4 mb-4">
          <div class="col-12 col-md-6">
            <label class="form-label text-secondary">Tamaño: {{ size }} px</label>
            <input
              type="range"
              class="form-range"
              min="100"
              max="500"
              step="50"
              [(ngModel)]="size"
            />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label text-secondary">Corrección de errores</label>
            <select class="form-select" [(ngModel)]="ecc">
              <option value="L">L (7%)</option>
              <option value="M">M (15%)</option>
              <option value="Q">Q (25%)</option>
              <option value="H">H (30%)</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary w-100" (click)="generar()" [disabled]="!texto.trim()">
          Generar QR
        </button>

        @if (qrUrl) {
          <div class="text-center mt-4 border rounded p-3">
            <label class="form-label text-secondary d-block mb-3">Código Generado</label>
            <img [src]="qrUrl" alt="Código QR" class="img-fluid border p-2 bg-white mb-3" />
            <div>
              <button class="btn btn-success" (click)="descargar()">Descargar PNG</button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
