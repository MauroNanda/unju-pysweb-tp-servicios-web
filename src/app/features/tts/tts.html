<div class="row justify-content-center">
  <div class="col-12 col-lg-8 col-xl-7">
    <div class="text-center mb-5">
      <h2 class="fw-bold mb-2">Estudio de Voz AI</h2>
      <p class="text-muted">Transforma texto en voz realista al instante.</p>
    </div>

    <div class="card shadow border-0 rounded-4 overflow-hidden position-relative">
      
      <!-- Top Bar for Voice Selection -->
      <div class="card-header bg-body-tertiary border-bottom-0 d-flex justify-content-between align-items-center py-3 px-4">
        <div class="d-flex align-items-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="text-primary me-2" viewBox="0 0 16 16">
            <path d="M11.536 14.079a4.813 4.813 0 0 1-2.588 4.23 4.814 4.814 0 0 1-2.588-4.23h5.176zm-5.176-1.5a4.814 4.814 0 0 1 2.588-4.23 4.814 4.814 0 0 1 2.588 4.23H6.36z"/>
            <path d="M8 12.5A4.5 4.5 0 0 1 3.5 8 4.5 4.5 0 0 1 8 3.5 4.5 4.5 0 0 1 12.5 8 4.5 4.5 0 0 1 8 12.5z"/>
          </svg>
          <span class="fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">Voz Seleccionada</span>
        </div>
        <select class="form-select form-select-sm border-0 bg-transparent fw-bold text-primary shadow-none w-auto cursor-pointer pe-4 fs-6" [(ngModel)]="voz">
          @for (v of voces; track v.id) {
            <option [value]="v.id" class="text-body">{{ v.label }}</option>
          }
        </select>
      </div>

      <!-- Text Editor Area -->
      <div class="card-body p-0">
        <textarea
          class="form-control border-0 shadow-none p-4 fs-5 text-body"
          rows="5"
          maxlength="300"
          [(ngModel)]="texto"
          placeholder="Escribe aquí lo que deseas que la IA lea..."
          style="resize: none; outline: none; background-color: transparent;"
        ></textarea>
        
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center px-4 pb-4 pt-2 gap-3">
          <small class="text-muted fw-semibold" [class.text-danger]="texto.length >= 300">
            {{ texto.length }} <span class="fw-normal">/ 300 caracteres</span>
          </small>
          
          <button
            class="btn btn-primary rounded-pill px-4 py-2 shadow-sm fw-bold d-flex align-items-center justify-content-center gap-2 transition-all hover-scale"
            (click)="convertir()"
            [disabled]="!formValido || loading"
            style="min-width: 180px;"
          >
            @if (loading) {
              <div class="spinner-border spinner-border-sm" role="status"></div>
              <span>Generando...</span>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11.596 8.697l-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>
              <span>Sintetizar Audio</span>
            }
          </button>
        </div>
      </div>
      
      <!-- Loading Overlay -->
      @if (loading) {
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-body bg-opacity-75 d-flex justify-content-center align-items-center rounded-4" style="z-index: 10; backdrop-filter: blur(2px);">
          <div class="text-center">
            <div class="spinner-grow text-primary mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
            <p class="fw-bold text-primary fs-5 mb-0">Procesando audio neuronal...</p>
          </div>
        </div>
      }
    </div>

    <!-- Error Alert -->
    @if (error) {
      <div class="alert alert-danger mt-4 shadow-sm border-0 rounded-3 d-flex align-items-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="me-2 flex-shrink-0" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/></svg>
        <div>{{ error }}</div>
      </div>
    }

    <!-- Result Player -->
    @if (audioUrl) {
      <div class="card shadow-sm border border-primary border-opacity-25 rounded-4 mt-4 bg-primary bg-opacity-10 position-relative overflow-hidden">
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-primary opacity-25" style="filter: blur(40px); z-index: 0;"></div>
        <div class="card-body p-4 text-center position-relative" style="z-index: 1;">
          <div class="mb-3">
            <span class="badge bg-primary rounded-pill px-3 py-2 shadow-sm fs-6">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2 mb-1" viewBox="0 0 16 16"><path d="M8 3a5 5 0 0 0-5 5v1h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V8a6 6 0 1 1 12 0v5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1V8a5 5 0 0 0-5-5z"/></svg>
              ¡Tu audio está listo!
            </span>
          </div>
          <audio [src]="audioUrl" controls class="w-100 rounded-pill shadow-sm bg-body" style="height: 54px; outline: none;"></audio>
        </div>
      </div>
    }
  </div>
</div>
