<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <h2 class="card-title text-center mb-5 fw-bold">Conversor de Divisas</h2>

        <div class="row g-3 mt-1">
          <div class="col-12 col-md-6">
            <label class="form-label text-secondary">Moneda Origen</label>
            <select class="form-select mb-3" [(ngModel)]="origen">
              @for (m of monedas; track m) {
                <option [value]="m">{{ m }}</option>
              }
            </select>
            <label class="form-label text-secondary">Monto Origen</label>
            <input type="number" class="form-control" [(ngModel)]="cantidad" min="0.01" max="1000000000000" step="0.01" />
            @if (cantidad > 1000000000000) {
              <small class="text-danger mt-1 d-block">El monto es demasiado grande.</small>
            }
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label text-secondary">Moneda Destino</label>
            <select class="form-select mb-3" [(ngModel)]="destino">
              @for (m of monedas; track m) {
                <option [value]="m">{{ m }}</option>
              }
            </select>
            <label class="form-label text-secondary">Monto Destino (Resultado)</label>
            <input
              type="text"
              class="form-control"
              [value]="resultado !== null && !loading ? (resultado | number: '1.2-4') : ''"
              readonly
              placeholder="Resultado..."
            />
          </div>
        </div>

        <button
          class="btn btn-primary w-100 mt-4"
          (click)="convertir()"
          [disabled]="!formValido || loading"
        >
          {{ loading ? 'Convirtiendo…' : 'Convertir' }}
        </button>

        @if (error) {
          <div class="alert alert-danger mt-3">{{ error }}</div>
        }
      </div>
    </div>
  </div>
</div>
