<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <h2 class="mb-5 text-center fw-bold">Generador de Códigos QR</h2>

    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="mb-4">
          <label class="form-label text-muted fw-semibold small text-uppercase">Texto o URL a codificar</label>
          <input class="form-control form-control-lg rounded-pill shadow-sm border-0 bg-body-tertiary px-4" [(ngModel)]="texto" placeholder="https://..." />
        </div>

        <div class="row g-4 mb-5">
          <div class="col-12 col-md-6">
            <label class="form-label text-muted fw-semibold small text-uppercase">Tamaño: {{ size }} px</label>
            <input
              type="range"
              class="form-range"
              min="100"
              max="500"
              step="50"
              [(ngModel)]="size"
            />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label text-muted fw-semibold small text-uppercase">Corrección de errores</label>
            <select class="form-select form-select-lg rounded-pill shadow-sm border-0 bg-body-tertiary px-4" [(ngModel)]="ecc">
              <option value="L">L (7%)</option>
              <option value="M">M (15%)</option>
              <option value="Q">Q (25%)</option>
              <option value="H">H (30%)</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm fw-bold" (click)="generar()" [disabled]="!texto.trim()">
          Generar QR
        </button>

        @if (qrUrl) {
          <div class="text-center mt-5 p-4 bg-body-tertiary rounded-4">
            <label class="form-label text-muted fw-semibold small text-uppercase d-block mb-3">Código Generado</label>
            <img [src]="qrUrl" alt="Código QR" class="img-fluid border-0 shadow-sm rounded-4 p-3 bg-white mb-4" />
            <div>
              <button class="btn btn-success btn-lg rounded-pill shadow-sm px-4 fw-bold" (click)="descargar()">Descargar PNG</button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
