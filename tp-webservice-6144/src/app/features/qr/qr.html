<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <h1 class="mb-4">Generador de Códigos QR</h1>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Texto o URL a codificar</label>
          <input class="form-control" [(ngModel)]="texto" placeholder="https://..." />
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Tamaño: {{ size }} px</label>
            <input
              type="range"
              class="form-range"
              min="100"
              max="500"
              step="50"
              [(ngModel)]="size"
            />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Corrección de errores</label>
            <select class="form-select" [(ngModel)]="ecc">
              <option value="L">L (7%)</option>
              <option value="M">M (15%)</option>
              <option value="Q">Q (25%)</option>
              <option value="H">H (30%)</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary w-100" (click)="generar()" [disabled]="!texto.trim()">
          Generar QR
        </button>

        @if (qrUrl) {
          <div class="text-center mt-4">
            <img [src]="qrUrl" alt="Código QR" class="img-fluid border rounded p-2" />
            <div class="mt-3">
              <button class="btn btn-success" (click)="descargar()">Descargar PNG</button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
