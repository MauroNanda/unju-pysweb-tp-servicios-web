<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Conversor de Divisas</h2>

        <div class="mb-3">
          <label class="form-label">Cantidad</label>
          <input type="number" class="form-control" [(ngModel)]="cantidad" min="0.01" step="0.01" />
        </div>

        <div class="row g-2">
          <div class="col-12 col-md-6">
            <label class="form-label">De</label>
            <select class="form-select" [(ngModel)]="origen">
              @for (m of monedas; track m) {
                <option [value]="m">{{ m }}</option>
              }
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">A</label>
            <select class="form-select" [(ngModel)]="destino">
              @for (m of monedas; track m) {
                <option [value]="m">{{ m }}</option>
              }
            </select>
          </div>
        </div>

        <button
          class="btn btn-primary w-100 mt-4"
          (click)="convertir()"
          [disabled]="!formValido || loading"
        >
          {{ loading ? 'Convirtiendo…' : 'Convertir' }}
        </button>

        @if (error) {
          <div class="alert alert-danger mt-3">{{ error }}</div>
        }

        @if (resultado !== null && !loading) {
          <div class="alert alert-success mt-3 text-center">
            <strong>{{ cantidad }} {{ origen }}</strong> =
            <strong class="fs-4">{{ resultado | number: '1.2-4' }} {{ destino }}</strong>
          </div>
        }
      </div>
    </div>
  </div>
</div>
