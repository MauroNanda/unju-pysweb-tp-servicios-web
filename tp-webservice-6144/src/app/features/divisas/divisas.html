<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <h2 class="card-title text-center mb-5 fw-bold">Conversor de Divisas</h2>

        <div class="row g-3 mt-1">
          <div class="col-12 col-md-6">
            <label class="form-label text-muted fw-semibold small text-uppercase">Moneda Origen</label>
            <select class="form-select form-select-lg mb-4 rounded-pill shadow-sm border-0 bg-body-tertiary" [(ngModel)]="origen">
              @for (m of monedas; track m) {
                <option [value]="m">{{ m }}</option>
              }
            </select>
            <label class="form-label text-muted fw-semibold small text-uppercase">Monto Origen</label>
            <input type="number" class="form-control form-control-lg rounded-pill shadow-sm border-0 bg-body-tertiary px-4" [(ngModel)]="cantidad" min="0.01" step="0.01" />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label text-muted fw-semibold small text-uppercase">Moneda Destino</label>
            <select class="form-select form-select-lg mb-4 rounded-pill shadow-sm border-0 bg-body-tertiary" [(ngModel)]="destino">
              @for (m of monedas; track m) {
                <option [value]="m">{{ m }}</option>
              }
            </select>
            <label class="form-label text-muted fw-semibold small text-uppercase">Monto Destino (Resultado)</label>
            <input
              type="text"
              class="form-control form-control-lg rounded-pill shadow-sm border-0 bg-body-tertiary px-4 text-primary fw-bold"
              [value]="resultado !== null && !loading ? (resultado | number: '1.2-4') : ''"
              readonly
              placeholder="Resultado..."
            />
          </div>
        </div>

        <button
          class="btn btn-primary btn-lg w-100 mt-5 rounded-pill shadow-sm fw-bold"
          (click)="convertir()"
          [disabled]="!formValido || loading"
        >
          {{ loading ? 'Convirtiendo…' : 'Convertir' }}
        </button>

        @if (error) {
          <div class="alert alert-danger mt-3">{{ error }}</div>
        }
      </div>
    </div>
  </div>
</div>
